<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PicBlast</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#171b2f 0%,#09090f 60%);color:#eef2ff;min-height:100vh;display:grid;place-items:center}
.card{text-align:center;padding:48px 40px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:28px;max-width:420px;width:90%}
h1{font-size:48px;font-weight:900;letter-spacing:.06em;background:linear-gradient(135deg,#67e8f9,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
p{color:#9aa4c3;margin-bottom:32px;line-height:1.6}
.btns{display:grid;gap:14px}
a{display:block;padding:16px;border-radius:18px;font-weight:800;font-size:16px;text-decoration:none}
.host{background:linear-gradient(135deg,#67e8f9,#22d3ee);color:#061017}
.player{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#eef2ff}
</style>
</head>
<body>
<div class="card">
  <h1>PicBlast</h1>
  <p>Game tebak gambar realtime multiplayer.<br>Siapa tercepat, dia yang menang.</p>
  <div class="btns">
    <a href="host.html" class="host">?? Buat Room (Host)</a>
    <a href="player.html" class="player">?? Gabung Room (Player)</a>
  </div>
</div>
</body>
</html>
